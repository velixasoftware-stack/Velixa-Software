services:
  # Runs in Singapore, next to the Supabase database in Mumbai (ap-south-1) -
  # ~3x quicker per database query than the old Oregon service (hms-lims, now
  # removed). The site (Netlify) calls it directly - see client/.env.production.
  # Secrets are entered in the Render dashboard (sync: false): Render keeps the
  # values already set and never overwrites them from this file.
  - type: web
    name: velixa-lims-sg
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CHIEF_ADMIN_USERNAME
        value: chiefadmin
      - key: CHIEF_ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
