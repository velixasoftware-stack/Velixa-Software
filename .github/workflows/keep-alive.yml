name: Keep API awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic,
# and the next visitor then waits for a cold start. Pinging the health check
# every 10 minutes keeps it awake. One always-on free service uses ~744 of the
# 750 free instance hours a month - adding a second free Render service would
# run out of hours, so remove this (or move to a paid plan) if you do.
# GitHub may delay scheduled runs at busy times, so an occasional cold start
# can still happen; a paid Render plan never sleeps at all.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 90 --retry 2 https://hms-lims.onrender.com/api/health
